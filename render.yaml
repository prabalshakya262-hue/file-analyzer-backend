services:
  - type: web
    name: file-analyzer-api
    runtime: docker
    dockerfilePath: Dockerfile
    envVars:
      - key: REDIS_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ENABLE_APK_HARDENING
        value: "true"
      - key: ENABLE_PE_HARDENING
        value: "true"
      - key: LLM_PROVIDER
        value: "openai"
      - key: ENABLE_DYNAMIC_ANALYSIS
        value: "false"
      - key: ENABLE_ORIGINAL_SIGNING
        value: "true"
      - key: CODE_SIGN_CERT_PATH
        sync: false
      - key: CODE_SIGN_CERT_PASSWORD
        sync: false
      - key: CODE_SIGN_KEY_ALIAS
        sync: false
      - key: CUCKOO_API_URL
        sync: false
      - key: MOBSF_API_URL
        sync: false
      - key: APKTOOL_PATH
        value: "apktool"
      - key: LLM_MODEL
        value: "gpt-4-turbo-preview"
      - key: MAX_FILE_SIZE
        value: "52428800"
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"