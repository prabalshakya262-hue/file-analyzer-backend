services:
  - type: web
    name: file-analyzer-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: REDIS_URL
        fromService:
          name: file-analyzer-redis
          type: redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: file-analyzer-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ENABLE_APK_HARDENING
        value: "true"
      - key: ENABLE_PE_HARDENING
        value: "true"
      - key: LLM_PROVIDER
        value: "openai"
      - key: ENABLE_DYNAMIC_ANALYSIS
        value: "false"

  - type: worker
    name: file-analyzer-worker
    env: docker
    dockerfilePath: ./backend/Dockerfile
    command: celery -A app.celery_app.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - key: REDIS_URL
        fromService:
          name: file-analyzer-redis
          type: redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: file-analyzer-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ENABLE_APK_HARDENING
        value: "true"
      - key: ENABLE_PE_HARDENING
        value: "true"
      - key: LLM_PROVIDER
        value: "openai"

  - type: redis
    name: file-analyzer-redis
    ipAllowList: []

databases:
  - name: file-analyzer-db
    databaseName: file_analyzer
    user: analyzer